name: QueryPilot

services:

  
  postgres:
    image: postgres:16
    container_name: postgres2
    environment:
      POSTGRES_DB: QueryPilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "35432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
